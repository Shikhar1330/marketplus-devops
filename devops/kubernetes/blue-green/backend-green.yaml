apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplus-backend-green
  namespace: marketplus
spec:
  replicas: 2
  selector:
    matchLabels: { app: marketplus-backend, version: green }
  template:
    metadata:
      labels: { app: marketplus-backend, version: green }
    spec:
      containers:
        - name: backend
          image: yourdockerhubusername/marketplus-backend:latest
          ports: [{ containerPort: 5000 }]
          env:
            - name: DATABASE_URL
              value: postgresql://marketplus:marketplus123@postgres:5432/marketplusdb
            - name: JWT_SECRET
              value: marketplus_super_secret_change_me
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 20
