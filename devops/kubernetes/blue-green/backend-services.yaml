apiVersion: v1
kind: Service
metadata:
  name: backend-live
  namespace: marketplus
spec:
  selector: { app: marketplus-backend, version: blue }
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-external
  namespace: marketplus
spec:
  type: LoadBalancer
  selector: { app: marketplus-backend, version: blue }
  ports:
    - port: 5000
      targetPort: 5000
