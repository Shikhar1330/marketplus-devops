apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: marketplus
type: Opaque
stringData:
  POSTGRES_DB: marketplusdb
  POSTGRES_USER: marketplus
  POSTGRES_PASSWORD: marketplus123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: marketplus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: marketplus
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-secret } }]
          volumeMounts: [{ name: postgres-data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: postgres-data
          persistentVolumeClaim: { claimName: postgres-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: marketplus
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
